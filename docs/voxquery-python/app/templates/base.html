<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Voxquery</title>
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 { font-size: 22px; font-weight: 500; }
    p.sub { color: #888; font-size: 14px; }
    input[type=text], input[type=email], input[type=password] { padding: 0.5rem 0.75rem; font-size: 14px; width: 100%; box-sizing: border-box; }
    button { padding: 0.5rem 1rem; font-size: 14px; cursor: pointer; }
    .row { display: flex; gap: 0.5rem; margin: 1rem 0; }
    .row input { flex: 1; }
    .warning { padding: 0.75rem 1rem; border: 1px solid #d97757; border-radius: 8px; font-size: 14px; margin-bottom: 1rem; }
    .error { color: #c0392b; font-size: 14px; }
    .rationale { font-size: 12px; color: #888; margin-top: 8px; }
    table.result-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    table.result-table th, table.result-table td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; }
    .toolbar { display: flex; gap: 0.75rem; align-items: center; font-size: 13px; margin-top: 1rem; }
    pre.sql { background: #f5f5f5; padding: 1rem; border-radius: 8px; font-size: 13px; overflow-x: auto; }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
