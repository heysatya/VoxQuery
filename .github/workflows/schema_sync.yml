name: Periodic Schema Sync

on:
  schedule:
    - cron: '0 2 * * *'  # Run daily at 2:00 AM UTC
  workflow_dispatch:      # Allow manual triggering

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv pip install --system -e .
          
      - name: Run Schema Sync
        working-directory: backend
        env:
          SNOWFLAKE_DSN: ${{ secrets.SNOWFLAKE_DSN }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FERNET_KEY: ${{ secrets.FERNET_KEY }}
          VOXQUERY_TENANT_ID: ${{ secrets.VOXQUERY_TENANT_ID }}
        run: |
          if [ -z "$VOXQUERY_TENANT_ID" ]; then
            echo "VOXQUERY_TENANT_ID must be set to the Clerk Organization ID to sync."
            exit 1
          fi
          python scripts/sync_schema.py --tenant-id "$VOXQUERY_TENANT_ID"
          python scripts/check_tenant_provisioning.py --tenant-id "$VOXQUERY_TENANT_ID"
