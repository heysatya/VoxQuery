[project]
name = "voxquery-backend"
version = "0.1.0"
description = "VoxQuery voice subsystem local MVP slice"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "pyjwt[crypto]>=2.8.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "redis>=5.0.0",
  "uvicorn[standard]>=0.30.0",
  "websockets>=16.0",
  "asyncpg>=0.29.0",
  "langfuse>=2.0.0",
  "anthropic>=0.31.0",
  "openai>=1.35.0",
  "sqlglot>=25.10.0",
  "snowflake-connector-python>=3.11.0",
  "aiohttp>=3.9.0",
  "tiktoken>=0.7.0",
  "langgraph>=0.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: marks tests as requiring external databases/services",
]

[tool.ruff]
line-length = 100
target-version = "py312"
