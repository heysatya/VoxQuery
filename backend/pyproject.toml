[project]
name = "voxquery-backend"
version = "0.1.0"
description = "VoxQuery voice subsystem local MVP slice"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "uvicorn[standard]>=0.30.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
