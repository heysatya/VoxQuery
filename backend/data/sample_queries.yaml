sample_queries:
  # ─── QUERY 1: Monthly Revenue Growth ─────────────────────
  - id: "sq_001"
    natural_language: "Show me monthly revenue growth with year-over-year comparison"
    paraphrases:
      - "What is our monthly revenue trend with YoY comparison?"
      - "How is revenue growing month over month compared to last year?"
      - "Monthly revenue with year over year growth percentage"
    sql: |
      WITH monthly_revenue AS (
          SELECT
              DATE_TRUNC('month', o.order_purchase_timestamp) AS month,
              SUM(oi.price * (1 - oi.discount_rate) + oi.freight_value) AS total_revenue
          FROM ORDERS o
          JOIN ORDER_ITEMS oi ON o.order_id = oi.order_id
          WHERE o.order_status = 'delivered'
          GROUP BY DATE_TRUNC('month', o.order_purchase_timestamp)
      )
      SELECT
          month,
          total_revenue,
          LAG(total_revenue, 1) OVER (ORDER BY month) AS prev_month_revenue,
          ROUND(
              ((total_revenue - LAG(total_revenue, 1) OVER (ORDER BY month))
               / LAG(total_revenue, 1) OVER (ORDER BY month)) * 100, 2
          ) AS mom_growth_pct,
          LAG(total_revenue, 12) OVER (ORDER BY month) AS yoy_revenue,
          ROUND(
              ((total_revenue - LAG(total_revenue, 12) OVER (ORDER BY month))
               / LAG(total_revenue, 12) OVER (ORDER BY month)) * 100, 2
          ) AS yoy_growth_pct
      FROM monthly_revenue
      ORDER BY month DESC
      LIMIT 24
    tables_used:
      - ORDERS
      - ORDER_ITEMS
    metrics_used:
      - revenue
    dimensions_used:
      - order_purchase_timestamp
    complexity: high
    domain: sales

  # ─── QUERY 2: Customer Lifetime Value by Segment ──────────
  - id: "sq_002"
    natural_language: "What is the customer lifetime value by segment with cohort analysis?"
    paraphrases:
      - "Show CLV by customer segment"
      - "Average customer lifetime value per segment"
      - "Customer value analysis by segment and cohort"
    sql: |
      WITH customer_cohorts AS (
          SELECT
              c.customer_id,
              c.customer_segment,
              DATE_TRUNC('month', MIN(o.order_purchase_timestamp)) AS cohort_month
          FROM CUSTOMERS c
          JOIN ORDERS o ON c.customer_id = o.customer_id
          GROUP BY c.customer_id, c.customer_segment
      ),
      customer_revenue AS (
          SELECT
              c.customer_id,
              c.customer_segment,
              cc.cohort_month,
              SUM(oi.price * (1 - oi.discount_rate)) AS total_spent,
              COUNT(DISTINCT o.order_id) AS order_count
          FROM CUSTOMERS c
          JOIN customer_cohorts cc ON c.customer_id = cc.customer_id
          JOIN ORDERS o ON c.customer_id = o.customer_id
          JOIN ORDER_ITEMS oi ON o.order_id = oi.order_id
          WHERE o.order_status = 'delivered'
          GROUP BY c.customer_id, c.customer_segment, cc.cohort_month
      )
      SELECT
          customer_segment,
          cohort_month,
          COUNT(customer_id)                                AS customers,
          ROUND(AVG(total_spent), 2)                        AS avg_clv,
          ROUND(AVG(order_count), 2)                        AS avg_orders_per_customer,
          ROUND(AVG(total_spent) / AVG(order_count), 2)     AS avg_order_value
      FROM customer_revenue
      GROUP BY customer_segment, cohort_month
      ORDER BY cohort_month DESC, avg_clv DESC
      LIMIT 100
    tables_used:
      - CUSTOMERS
      - ORDERS
      - ORDER_ITEMS
    metrics_used:
      - revenue
      - active_customers
      - average_order_value
    dimensions_used:
      - customer_segment
      - cohort_month
    complexity: advanced
    domain: customers

  # ─── QUERY 3: Top Products by Profit Margin ───────────────
  - id: "sq_003"
    natural_language: "What are the top 20 products by profit margin?"
    paraphrases:
      - "Show me our most profitable products"
      - "Top products ranked by profit margin percentage"
      - "Which products have the highest margins?"
    sql: |
      WITH product_metrics AS (
          SELECT
              p.product_id,
              p.product_name,
              p.product_category_name,
              p.product_brand,
              SUM(oi.price * (1 - oi.discount_rate))       AS total_revenue,
              SUM(p.cost)                                   AS total_cost,
              SUM(oi.price * (1 - oi.discount_rate))
                  - SUM(p.cost)                             AS total_profit,
              COUNT(DISTINCT oi.order_id)                   AS units_sold
          FROM PRODUCTS p
          JOIN ORDER_ITEMS oi ON p.product_id = oi.product_id
          JOIN ORDERS o ON oi.order_id = o.order_id
          WHERE o.order_status = 'delivered'
          GROUP BY p.product_id, p.product_name, p.product_category_name, p.product_brand
      )
      SELECT
          product_name,
          product_category_name,
          product_brand,
          ROUND(total_revenue, 2)                           AS total_revenue,
          ROUND(total_cost, 2)                              AS total_cost,
          ROUND(total_profit, 2)                            AS total_profit,
          ROUND((total_profit / total_revenue) * 100, 2)   AS profit_margin_pct,
          units_sold,
          RANK() OVER (ORDER BY total_profit DESC)          AS profit_rank
      FROM product_metrics
      ORDER BY total_profit DESC
      LIMIT 20
    tables_used:
      - PRODUCTS
      - ORDER_ITEMS
      - ORDERS
    metrics_used:
      - revenue
      - product_revenue
    dimensions_used:
      - product_name
      - product_category_name
      - product_brand
    complexity: high
    domain: products

  # ─── QUERY 4: Seller Performance Scorecard ────────────────
  - id: "sq_004"
    natural_language: "Show me the seller performance scorecard with rankings"
    paraphrases:
      - "How are our sellers performing?"
      - "Seller scorecard with revenue and ratings"
      - "Top sellers by revenue with delivery performance"
    sql: |
      WITH seller_metrics AS (
          SELECT
              s.seller_id,
              s.seller_company_name,
              s.seller_state,
              COUNT(DISTINCT oi.order_id)                           AS total_orders,
              SUM(oi.price * (1 - oi.discount_rate))               AS total_revenue,
              AVG(r.review_score)                                   AS avg_review_score,
              AVG(
                  EPOCH(o.order_delivered_customer_date)
                  - EPOCH(o.order_purchase_timestamp)
              ) / 86400.0                                           AS avg_delivery_days,
              COUNT(DISTINCT CASE
                  WHEN o.order_delivered_customer_date
                       > o.order_estimated_delivery_date
                  THEN o.order_id END)                             AS late_deliveries,
              COUNT(DISTINCT p.product_id)                          AS unique_products
          FROM SELLERS s
          JOIN ORDER_ITEMS oi ON s.seller_id = oi.seller_id
          JOIN ORDERS o ON oi.order_id = o.order_id
          LEFT JOIN ORDER_REVIEWS r ON o.order_id = r.order_id
          JOIN PRODUCTS p ON oi.product_id = p.product_id
          WHERE o.order_status = 'delivered'
          GROUP BY s.seller_id, s.seller_company_name, s.seller_state
      )
      SELECT
          seller_company_name,
          seller_state,
          total_orders,
          ROUND(total_revenue, 2)                                   AS total_revenue,
          ROUND(avg_review_score, 2)                                AS avg_rating,
          ROUND(avg_delivery_days, 1)                               AS avg_delivery_days,
          ROUND((late_deliveries * 100.0 / total_orders), 2)       AS late_delivery_pct,
          unique_products,
          RANK() OVER (ORDER BY total_revenue DESC)                 AS revenue_rank,
          RANK() OVER (ORDER BY avg_review_score DESC)              AS rating_rank
      FROM seller_metrics
      ORDER BY total_revenue DESC
      LIMIT 20
    tables_used:
      - SELLERS
      - ORDER_ITEMS
      - ORDERS
      - ORDER_REVIEWS
      - PRODUCTS
    metrics_used:
      - revenue
      - order_count
    dimensions_used:
      - seller_company_name
      - seller_state
    complexity: advanced
    domain: sellers

  # ─── QUERY 5: Geographic Revenue Heatmap ─────────────────
  - id: "sq_005"
    natural_language: "Show geographic revenue performance by state and city"
    paraphrases:
      - "Revenue heatmap by geography"
      - "Which states have the highest sales?"
      - "Revenue by region and city"
    sql: |
      WITH geo_performance AS (
          SELECT
              g.geolocation_state,
              g.geolocation_city,
              COUNT(DISTINCT o.order_id)                    AS total_orders,
              COUNT(DISTINCT c.customer_id)                 AS unique_customers,
              SUM(oi.price * (1 - oi.discount_rate)
                  + oi.freight_value)                       AS total_revenue,
              AVG(oi.price * (1 - oi.discount_rate))        AS avg_order_value
          FROM GEOLOCATION g
          JOIN CUSTOMERS c ON g.zip_code_prefix = c.customer_zip_code_prefix
          JOIN ORDERS o ON c.customer_id = o.customer_id
          JOIN ORDER_ITEMS oi ON o.order_id = oi.order_id
          WHERE o.order_status = 'delivered'
          GROUP BY g.geolocation_state, g.geolocation_city
      )
      SELECT
          geolocation_state,
          geolocation_city,
          total_orders,
          unique_customers,
          ROUND(total_revenue, 2)                           AS total_revenue,
          ROUND(avg_order_value, 2)                         AS avg_order_value,
          ROUND(total_revenue / unique_customers, 2)        AS revenue_per_customer,
          RANK() OVER (
              PARTITION BY geolocation_state
              ORDER BY total_revenue DESC
          )                                                 AS city_rank_in_state
      FROM geo_performance
      ORDER BY total_revenue DESC
      LIMIT 50
    tables_used:
      - GEOLOCATION
      - CUSTOMERS
      - ORDERS
      - ORDER_ITEMS
    metrics_used:
      - revenue
      - active_customers
    dimensions_used:
      - geolocation_state
      - geolocation_city
    complexity: high
    domain: geography

  # ─── QUERY 6: Customer Churn Analysis ────────────────────
  - id: "sq_006"
    natural_language: "Analyze customer churn with recency segmentation"
    paraphrases:
      - "Which customers are at risk of churning?"
      - "Show me churned and at-risk customers by segment"
      - "Customer churn analysis by recency"
    sql: |
      WITH customer_last_order AS (
          SELECT
              c.customer_id,
              c.customer_segment,
              c.customer_state,
              MAX(o.order_purchase_timestamp)          AS last_order_date,
              COUNT(o.order_id)                        AS total_orders,
              SUM(oi.price * (1 - oi.discount_rate))  AS total_spent
          FROM CUSTOMERS c
          JOIN ORDERS o ON c.customer_id = o.customer_id
          JOIN ORDER_ITEMS oi ON o.order_id = oi.order_id
          WHERE o.order_status = 'delivered'
          GROUP BY c.customer_id, c.customer_segment, c.customer_state
      ),
      churn_segments AS (
          SELECT
              customer_id,
              customer_segment,
              customer_state,
              last_order_date,
              total_orders,
              total_spent,
              DATEDIFF('day', last_order_date, CURRENT_DATE) AS days_since_last_order,
              CASE
                  WHEN DATEDIFF('day', last_order_date, CURRENT_DATE) <= 30
                      THEN 'Active'
                  WHEN DATEDIFF('day', last_order_date, CURRENT_DATE) <= 90
                      THEN 'At Risk'
                  WHEN DATEDIFF('day', last_order_date, CURRENT_DATE) <= 180
                      THEN 'Churning'
                  ELSE 'Churned'
              END AS churn_status
          FROM customer_last_order
      )
      SELECT
          churn_status,
          customer_segment,
          COUNT(customer_id)                                        AS customer_count,
          ROUND(AVG(total_spent), 2)                                AS avg_lifetime_value,
          ROUND(AVG(total_orders), 2)                               AS avg_orders,
          ROUND(AVG(days_since_last_order), 1)                      AS avg_days_inactive,
          ROUND(
              COUNT(customer_id) * 100.0
              / SUM(COUNT(customer_id)) OVER (), 2
          )                                                         AS pct_of_total
      FROM churn_segments
      GROUP BY churn_status, customer_segment
      ORDER BY
          CASE churn_status
              WHEN 'Active'   THEN 1
              WHEN 'At Risk'  THEN 2
              WHEN 'Churning' THEN 3
              ELSE 4
          END,
          customer_segment
    tables_used:
      - CUSTOMERS
      - ORDERS
      - ORDER_ITEMS
    metrics_used:
      - active_customers
      - revenue
    dimensions_used:
      - customer_segment
      - churn_status
    complexity: advanced
    domain: customers

  # ─── QUERY 7: Payment Method Analysis ────────────────────
  - id: "sq_007"
    natural_language: "Analyze payment methods and installment behavior"
    paraphrases:
      - "How are customers paying for their orders?"
      - "Payment type breakdown with installment insights"
      - "Which payment methods are most used?"
    sql: |
      WITH payment_analysis AS (
          SELECT
              op.payment_type,
              op.payment_installments,
              COUNT(DISTINCT op.order_id)              AS transaction_count,
              SUM(op.payment_value)                    AS total_payment_value,
              AVG(op.payment_value)                    AS avg_transaction_value,
              SUM(oi.price * (1 - oi.discount_rate))  AS total_order_value
          FROM ORDER_PAYMENTS op
          JOIN ORDER_ITEMS oi ON op.order_id = oi.order_id
          JOIN ORDERS o ON op.order_id = o.order_id
          WHERE o.order_status = 'delivered'
          GROUP BY op.payment_type, op.payment_installments
      )
      SELECT
          payment_type,
          payment_installments,
          transaction_count,
          ROUND(total_payment_value, 2)                AS total_payment_value,
          ROUND(avg_transaction_value, 2)              AS avg_transaction_value,
          ROUND(total_order_value, 2)                  AS total_order_value,
          ROUND(
              transaction_count * 100.0
              / SUM(transaction_count) OVER (PARTITION BY payment_type), 2
          )                                            AS pct_within_payment_type,
          ROUND(
              total_payment_value * 100.0
              / SUM(total_payment_value) OVER (), 2
          )                                            AS pct_of_total_revenue
      FROM payment_analysis
      ORDER BY payment_type, payment_installments
    tables_used:
      - ORDER_PAYMENTS
      - ORDER_ITEMS
      - ORDERS
    metrics_used:
      - revenue
      - order_count
    dimensions_used:
      - payment_type
      - payment_installments
    complexity: high
    domain: payments

  # ─── QUERY 8: Delivery Performance Dashboard ──────────────
  - id: "sq_008"
    natural_language: "Show delivery performance with on-time vs late analysis"
    paraphrases:
      - "How is our delivery performance?"
      - "What percentage of deliveries are on time?"
      - "Late delivery analysis by state"
    sql: |
      WITH delivery_metrics AS (
          SELECT
              DATE_TRUNC('month', o.order_purchase_timestamp) AS order_month,
              s.seller_state,
              COUNT(o.order_id)                               AS total_deliveries,
              COUNT(CASE
                  WHEN o.order_delivered_customer_date
                       <= o.order_estimated_delivery_date
                  THEN 1 END)                                 AS on_time_deliveries,
              COUNT(CASE
                  WHEN o.order_delivered_customer_date
                       > o.order_estimated_delivery_date
                  THEN 1 END)                                 AS late_deliveries,
              AVG(
                  (EPOCH(o.order_delivered_customer_date)
                   - EPOCH(o.order_purchase_timestamp)) / 86400.0
              )                                               AS avg_delivery_days,
              AVG(
                  (EPOCH(o.order_estimated_delivery_date)
                   - EPOCH(o.order_purchase_timestamp)) / 86400.0
              )                                               AS avg_estimated_days
          FROM ORDERS o
          JOIN ORDER_ITEMS oi ON o.order_id = oi.order_id
          JOIN SELLERS s ON oi.seller_id = s.seller_id
          WHERE o.order_status = 'delivered'
            AND o.order_delivered_customer_date IS NOT NULL
          GROUP BY
              DATE_TRUNC('month', o.order_purchase_timestamp),
              s.seller_state
      )
      SELECT
          order_month,
          seller_state,
          total_deliveries,
          on_time_deliveries,
          late_deliveries,
          ROUND(on_time_deliveries * 100.0 / total_deliveries, 2) AS on_time_pct,
          ROUND(avg_delivery_days, 1)                             AS avg_actual_delivery_days,
          ROUND(avg_estimated_days, 1)                            AS avg_estimated_days,
          ROUND(avg_delivery_days - avg_estimated_days, 1)        AS delivery_variance_days
      FROM delivery_metrics
      ORDER BY order_month DESC, total_deliveries DESC
      LIMIT 100
    tables_used:
      - ORDERS
      - ORDER_ITEMS
      - SELLERS
    metrics_used:
      - order_count
    dimensions_used:
      - seller_state
      - order_month
    complexity: high
    domain: operations

  # ─── QUERY 9: Review Sentiment Impact on Sales ───────────
  - id: "sq_009"
    natural_language: "How do customer reviews impact product sales performance?"
    paraphrases:
      - "Show review scores and their correlation with sales"
      - "Products with highest ratings and sales"
      - "Review sentiment impact on revenue"
    sql: |
      WITH review_metrics AS (
          SELECT
              p.product_id,
              p.product_name,
              p.product_category_name,
              AVG(r.review_score)                       AS avg_review_score,
              COUNT(r.review_id)                        AS review_count,
              COUNT(CASE WHEN r.review_score >= 4 THEN 1 END) AS positive_reviews,
              COUNT(CASE WHEN r.review_score <= 2 THEN 1 END) AS negative_reviews
          FROM PRODUCTS p
          JOIN ORDER_ITEMS oi ON p.product_id = oi.product_id
          JOIN ORDERS o ON oi.order_id = o.order_id
          LEFT JOIN ORDER_REVIEWS r ON o.order_id = r.order_id
          WHERE o.order_status = 'delivered'
          GROUP BY p.product_id, p.product_name, p.product_category_name
      ),
      sales_metrics AS (
          SELECT
              p.product_id,
              COUNT(DISTINCT oi.order_id)               AS units_sold,
              SUM(oi.price * (1 - oi.discount_rate))   AS total_revenue
          FROM PRODUCTS p
          JOIN ORDER_ITEMS oi ON p.product_id = oi.product_id
          JOIN ORDERS o ON oi.order_id = o.order_id
          WHERE o.order_status = 'delivered'
          GROUP BY p.product_id
      )
      SELECT
          rm.product_name,
          rm.product_category_name,
          ROUND(rm.avg_review_score, 2)                 AS avg_rating,
          rm.review_count,
          ROUND(
              rm.positive_reviews * 100.0
              / NULLIF(rm.review_count, 0), 2
          )                                             AS positive_review_pct,
          sm.units_sold,
          ROUND(sm.total_revenue, 2)                    AS total_revenue,
          ROUND(sm.total_revenue / sm.units_sold, 2)    AS revenue_per_unit
      FROM review_metrics rm
      JOIN sales_metrics sm ON rm.product_id = sm.product_id
      WHERE rm.review_count >= 1
      ORDER BY sm.total_revenue DESC
      LIMIT 50
    tables_used:
      - PRODUCTS
      - ORDER_ITEMS
      - ORDERS
      - ORDER_REVIEWS
    metrics_used:
      - revenue
      - product_revenue
      - units_sold
    dimensions_used:
      - product_name
      - product_category_name
    complexity: high
    domain: products

  # ─── QUERY 10: Executive KPI Dashboard ───────────────────
  - id: "sq_010"
    natural_language: "Give me the executive KPI dashboard for this month vs last month"
    paraphrases:
      - "Show key business metrics for current month"
      - "Executive summary of KPIs with month-over-month comparison"
      - "What are our key numbers this month?"
      - "Current month performance vs previous month"
    sql: |
      WITH current_period AS (
          SELECT
              COUNT(DISTINCT o.order_id)                         AS total_orders,
              COUNT(DISTINCT c.customer_id)                      AS total_customers,
              SUM(oi.price * (1 - oi.discount_rate)
                  + oi.freight_value)                            AS total_revenue,
              SUM(oi.price * (1 - oi.discount_rate))
                  - SUM(p.cost)                                  AS total_profit,
              AVG(oi.price * (1 - oi.discount_rate))             AS avg_order_value,
              AVG(r.review_score)                                AS avg_review_score
          FROM ORDERS o
          JOIN ORDER_ITEMS oi ON o.order_id = oi.order_id
          JOIN CUSTOMERS c ON o.customer_id = c.customer_id
          JOIN PRODUCTS p ON oi.product_id = p.product_id
          LEFT JOIN ORDER_REVIEWS r ON o.order_id = r.order_id
          WHERE o.order_status = 'delivered'
            AND o.order_purchase_timestamp
                >= DATE_TRUNC('month', CURRENT_DATE)
      ),
      previous_period AS (
          SELECT
              COUNT(DISTINCT o.order_id)                         AS total_orders,
              COUNT(DISTINCT c.customer_id)                      AS total_customers,
              SUM(oi.price * (1 - oi.discount_rate)
                  + oi.freight_value)                            AS total_revenue
          FROM ORDERS o
          JOIN ORDER_ITEMS oi ON o.order_id = oi.order_id
          JOIN CUSTOMERS c ON o.customer_id = c.customer_id
          WHERE o.order_status = 'delivered'
            AND o.order_purchase_timestamp
                >= DATE_TRUNC('month', CURRENT_DATE - INTERVAL '1 month')
            AND o.order_purchase_timestamp
                < DATE_TRUNC('month', CURRENT_DATE)
      )
      SELECT
          'Current Month'                                         AS period,
          cp.total_orders,
          cp.total_customers,
          ROUND(cp.total_revenue, 2)                              AS total_revenue,
          ROUND(cp.total_profit, 2)                               AS total_profit,
          ROUND(cp.total_profit / NULLIF(cp.total_revenue, 0)
                * 100, 2)                                         AS profit_margin_pct,
          ROUND(cp.avg_order_value, 2)                            AS avg_order_value,
          ROUND(cp.avg_review_score, 2)                           AS avg_customer_satisfaction,
          ROUND(
              (cp.total_orders - pp.total_orders) * 100.0
              / NULLIF(pp.total_orders, 0), 2
          )                                                       AS order_growth_pct,
          ROUND(
              (cp.total_revenue - pp.total_revenue)
              / NULLIF(pp.total_revenue, 0) * 100, 2
          )                                                       AS revenue_growth_pct
      FROM current_period cp
      CROSS JOIN previous_period pp
    tables_used:
      - ORDERS
      - ORDER_ITEMS
      - CUSTOMERS
      - PRODUCTS
      - ORDER_REVIEWS
    metrics_used:
      - revenue
      - order_count
      - active_customers
      - average_order_value
    dimensions_used:
      - order_purchase_timestamp
    complexity: advanced
    domain: executive

  # ─── QUERY 11: Customer RFM Segmentation ─────────────────
  - id: "sq_011"
    natural_language: "Segment customers using RFM analysis"
    paraphrases:
      - "Show customer RFM segments"
      - "Classify customers by recency frequency and monetary value"
      - "Which customers are our champions?"
    sql: |
      WITH rfm_base AS (
          SELECT
              c.customer_id,
              c.customer_segment,
              c.customer_state,
              MAX(o.order_purchase_timestamp)          AS last_order_date,
              COUNT(DISTINCT o.order_id)               AS frequency,
              SUM(oi.price * (1 - oi.discount_rate))  AS monetary
          FROM CUSTOMERS c
          JOIN ORDERS o ON c.customer_id = o.customer_id
          JOIN ORDER_ITEMS oi ON o.order_id = oi.order_id
          WHERE o.order_status = 'delivered'
          GROUP BY c.customer_id, c.customer_segment, c.customer_state
      ),
      rfm_scores AS (
          SELECT
              customer_id,
              customer_segment,
              customer_state,
              DATEDIFF('day', last_order_date, CURRENT_DATE) AS recency_days,
              frequency,
              monetary,
              NTILE(5) OVER (
                  ORDER BY DATEDIFF('day', last_order_date, CURRENT_DATE) DESC
              )                                              AS recency_score,
              NTILE(5) OVER (ORDER BY frequency ASC)         AS frequency_score,
              NTILE(5) OVER (ORDER BY monetary ASC)          AS monetary_score
          FROM rfm_base
      ),
      rfm_segments AS (
          SELECT
              *,
              recency_score + frequency_score + monetary_score AS rfm_total,
              CASE
                  WHEN recency_score >= 4 AND frequency_score >= 4
                       AND monetary_score >= 4     THEN 'Champions'
                  WHEN recency_score >= 3 AND frequency_score >= 3
                                                   THEN 'Loyal Customers'
                  WHEN recency_score >= 4 AND frequency_score <= 2
                                                   THEN 'Promising'
                  WHEN recency_score <= 2 AND frequency_score >= 3
                                                   THEN 'At Risk'
                  WHEN recency_score <= 2 AND frequency_score <= 2
                                                   THEN 'Lost'
                  ELSE 'Others'
              END AS rfm_segment
          FROM rfm_scores
      )
      SELECT
          rfm_segment,
          customer_segment,
          COUNT(customer_id)             AS customer_count,
          ROUND(AVG(monetary), 2)        AS avg_monetary_value,
          ROUND(AVG(frequency), 2)       AS avg_frequency,
          ROUND(AVG(recency_days), 1)    AS avg_recency_days,
          ROUND(SUM(monetary), 2)        AS total_revenue
      FROM rfm_segments
      GROUP BY rfm_segment, customer_segment
      ORDER BY total_revenue DESC
      LIMIT 50
    tables_used:
      - CUSTOMERS
      - ORDERS
      - ORDER_ITEMS
    metrics_used:
      - active_customers
      - revenue
    dimensions_used:
      - customer_segment
      - rfm_segment
    complexity: advanced
    domain: customers

  # ─── QUERY 12: Discount Effectiveness ────────────────────
  - id: "sq_012"
    natural_language: "How effective are our discounts on sales and profitability?"
    paraphrases:
      - "Show discount impact on revenue and profit"
      - "Discount effectiveness analysis by category"
      - "Price elasticity and discount analysis"
    sql: |
      WITH discount_analysis AS (
          SELECT
              p.product_category_name,
              CASE
                  WHEN oi.discount_rate = 0        THEN 'No Discount'
                  WHEN oi.discount_rate <= 0.10    THEN '1-10%'
                  WHEN oi.discount_rate <= 0.20    THEN '11-20%'
                  WHEN oi.discount_rate <= 0.30    THEN '21-30%'
                  ELSE '30%+'
              END                                                   AS discount_tier,
              COUNT(DISTINCT oi.order_id)                           AS order_count,
              SUM(oi.price * (1 - oi.discount_rate))                AS net_revenue,
              SUM(oi.price * oi.discount_rate)                      AS total_discount_amount,
              AVG(oi.price)                                         AS avg_list_price,
              AVG(oi.price * (1 - oi.discount_rate))                AS avg_net_price,
              SUM(oi.price * (1 - oi.discount_rate)) - SUM(p.cost) AS total_profit
          FROM ORDER_ITEMS oi
          JOIN ORDERS o ON oi.order_id = o.order_id
          JOIN PRODUCTS p ON oi.product_id = p.product_id
          WHERE o.order_status = 'delivered'
          GROUP BY
              p.product_category_name,
              CASE
                  WHEN oi.discount_rate = 0        THEN 'No Discount'
                  WHEN oi.discount_rate <= 0.10    THEN '1-10%'
                  WHEN oi.discount_rate <= 0.20    THEN '11-20%'
                  WHEN oi.discount_rate <= 0.30    THEN '21-30%'
                  ELSE '30%+'
              END
      )
      SELECT
          product_category_name,
          discount_tier,
          order_count,
          ROUND(net_revenue, 2)                                     AS net_revenue,
          ROUND(total_discount_amount, 2)                           AS discount_amount,
          ROUND(avg_list_price, 2)                                  AS avg_list_price,
          ROUND(avg_net_price, 2)                                   AS avg_net_price,
          ROUND(total_profit, 2)                                    AS total_profit,
          ROUND(total_profit / NULLIF(net_revenue, 0) * 100, 2)    AS profit_margin_pct,
          ROUND(
              order_count * 100.0
              / SUM(order_count) OVER (PARTITION BY product_category_name), 2
          )                                                         AS pct_of_category_orders
      FROM discount_analysis
      ORDER BY product_category_name, discount_tier
    tables_used:
      - ORDER_ITEMS
      - ORDERS
      - PRODUCTS
    metrics_used:
      - revenue
      - discount_rate
    dimensions_used:
      - product_category_name
      - discount_tier
    complexity: high
    domain: products
