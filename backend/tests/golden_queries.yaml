# ============================================================
# Golden Evaluation Dataset
# Schema-Aware RAG Layer — VoxQuery Sales Analytics
# Source: VoxQuery Executive Questions + DBSchema
# ============================================================
# Format:
#   question:        Natural language query to test
#   expected_chunks: What the retriever MUST return
#     - metric:      Metric card for this metric name
#     - table:       Table card for this table
#     - rule:        Business rule containing this keyword
#   min_recall_at_5: Minimum acceptable recall in top-5 (0.0-1.0)
# ============================================================

queries:
  # ─── Revenue Questions ──────────────────────────────────────
  - id: "gq_001"
    question: "What was revenue by region last quarter?"
    domain: sales
    complexity: simple
    expected_chunks:
      - metric: revenue
      - table: ORDERS
      - table: ORDER_ITEMS
      - rule: completed_orders_only
      - rule: revenue_net_of_discounts
    min_recall_at_5: 0.80
    min_recall_at_10: 0.90

  - id: "gq_002"
    question: "Show me monthly revenue growth with year over year comparison"
    domain: sales
    complexity: high
    expected_chunks:
      - metric: revenue
      - table: ORDERS
      - table: ORDER_ITEMS
      - rule: duckdb_date_syntax
    min_recall_at_5: 0.75
    min_recall_at_10: 0.90

  - id: "gq_003"
    question: "What is our total gross revenue this year?"
    domain: sales
    complexity: simple
    expected_chunks:
      - metric: gross_revenue
      - table: ORDERS
      - table: ORDER_ITEMS
    min_recall_at_5: 0.75
    min_recall_at_10: 0.85

  # ─── Order Questions ────────────────────────────────────────
  - id: "gq_004"
    question: "How many orders were placed last month?"
    domain: sales
    complexity: simple
    expected_chunks:
      - metric: order_count
      - table: ORDERS
      - rule: completed_orders_only
