    min_recall_at_10: 0.90

  - id: "gq_006"
    question: "What is the average order value by customer segment?"
    domain: sales
    complexity: medium
    expected_chunks:
      - metric: average_order_value
      - table: ORDERS
      - table: ORDER_ITEMS
      - table: CUSTOMERS
    min_recall_at_5: 0.75
    min_recall_at_10: 0.90

