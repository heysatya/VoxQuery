<svg width="400" height="260" viewBox="0 0 400 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">VoxQuery Vector Logo</title>
  <desc id="hero-desc">Flowing voice waveforms in neon blue and green forming a V pattern entering a 3D wireframe hexagon data cube.</desc>
  <defs>
    <linearGradient id="hero-blue-wave" x1="10" y1="70" x2="220" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#4ADE80" />
    </linearGradient>

    <linearGradient id="hero-green-wave" x1="10" y1="90" x2="220" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="60%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="hero-text-blue" x1="0" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <filter id="hero-vector-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#hero-vector-glow)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Flowing Intersecting V-Waveform Voice Lines -->
    <path d="M16 80 C 45 80, 55 30, 85 30 C 115 30, 125 120, 155 120 C 185 120, 210 50, 240 50 C 265 50, 280 85, 305 85" 
          stroke="url(#hero-blue-wave)" stroke-width="5" />

    <path d="M16 80 C 50 80, 60 115, 90 115 C 120 115, 130 35, 160 35 C 190 35, 205 95, 235 95 C 265 95, 285 60, 310 60" 
          stroke="url(#hero-green-wave)" stroke-width="4" opacity="0.9" />

    <!-- 3D Geometric Wireframe Hexagon-Cube Structure -->
    <!-- Top Face -->
    <path d="M240 50 L 295 24 L 345 48 L 290 75 Z" stroke="url(#hero-blue-wave)" stroke-width="3.2" fill="rgba(56, 189, 248, 0.05)" />
    <!-- Left Face -->
    <path d="M240 50 V 105 L 290 132 V 75 Z" stroke="url(#hero-blue-wave)" stroke-width="3.2" fill="rgba(56, 189, 248, 0.08)" />
    <!-- Right Face -->
    <path d="M290 75 L 345 48 V 103 L 290 132 Z" stroke="url(#hero-green-wave)" stroke-width="3.2" fill="rgba(74, 222, 128, 0.06)" />
    <!-- Internal Wireframe Edges -->
    <path d="M240 105 L 295 78 L 345 103 L 290 130 Z" stroke="url(#hero-green-wave)" stroke-width="2.2" stroke-dasharray="4 3" opacity="0.75" />
  </g>

  <!-- Glowing Vertex Nodes -->
  <circle cx="295" cy="24" r="5" fill="#4ADE80" filter="url(#hero-vector-glow)" />
  <circle cx="345" cy="48" r="5" fill="#38BDF8" filter="url(#hero-vector-glow)" />
  <circle cx="290" cy="132" r="5" fill="#4ADE80" filter="url(#hero-vector-glow)" />

  <!-- Brand Title: VoxQuery in Clean Bold Neon Blue Font -->
  <text x="200" y="195" text-anchor="middle" fill="url(#hero-text-blue)" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="38" letter-spacing="-0.8">
    Vox<tspan fill="#FFFFFF">Query</tspan>
  </text>

  <!-- Subtext: Voice-Driven Data Analysis in Crisp Neon Green Font -->
  <text x="200" y="226" text-anchor="middle" fill="#4ADE80" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" letter-spacing="1.8">
    VOICE-DRIVEN DATA ANALYSIS
  </text>
</svg>
