<svg width="160" height="100" viewBox="0 0 160 100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">VoxQuery mark</title>
  <desc id="desc">Layered voice waveforms flowing into a connected data cube.</desc>
  <defs>
    <linearGradient id="wave" x1="8" y1="50" x2="150" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6" />
